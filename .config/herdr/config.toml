onboarding = false

[theme]
name = "rose-pine"

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+f"
previous_tab = "alt+left"
next_tab = "alt+right"
previous_workspace = "alt+up"
next_workspace = "alt+down"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

[[keys.command]]
# https://github.com/meerzulee/herdr-float
key = "alt+f"
type = "plugin_action"
command = "herdr-float.toggle"
description = "Toggle floating shell"

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "terminal_title_stripped"]]
# claude = [["state_icon", "workspace"], ["terminal_title_stripped"]]
# claude = [["state_icon", "terminal_title_stripped"], ["workspace"]]

[ui.toast]
delivery = "system"
